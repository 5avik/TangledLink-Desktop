[package]
name = "tangledlink-desktop"
version = "1.0.0"
edition = "2024"
publish = false
default-run = "tangledlink-desktop"

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
percent-encoding = "2"
url = "2"

[target.'cfg(windows)'.dependencies]
ctrlc = "3"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
