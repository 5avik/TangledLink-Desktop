[package]
name = "tangledlink-app"
version = "1.1.0"
edition = "2024"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tangledlink-desktop = { path = ".." }
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
ureq = { version = "3", default-features = true }
url = "2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
libc = "0.2"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
