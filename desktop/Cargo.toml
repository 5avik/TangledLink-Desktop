[package]
name = "tangledlink-app"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
tangledlink-desktop = { path = ".." }
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
ureq = { version = "3", default-features = true }
url = "2"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
tempfile = "3"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
